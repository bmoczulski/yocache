name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: cmd/yocache/web/package-lock.json
      - name: Build web dashboard
        working-directory: cmd/yocache/web
        run: |
          npm ci
          npm run build
      - run: mkdir -p .cache/home .cache/go
      - run: docker build -t yocache-dev .devcontainer
      - run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD":/workspace -w /workspace yocache-dev \
            sh -c 'go build ./cmd/... && go vet ./cmd/... && go test -race ./cmd/...'
