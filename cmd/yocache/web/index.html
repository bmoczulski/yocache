<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YoCache</title>
    <style>
      /* Inline first-paint styles: shown while the JS bundle is still
         downloading, replaced the instant Svelte mounts App into #app.
         Colours are duplicated from app.css variables on purpose — app.css
         hasn't loaded yet at this point. */
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #0f1115;
        color: #e5e9f0;
        font-family:
          ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
      }
      .boot {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #8b93a7;
      }
      .boot-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #232833;
        border-top-color: #6ee7b7;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      .boot p {
        margin: 0;
        font-size: 14px;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-spinner" aria-hidden="true"></div>
        <p>Loading YoCache…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
